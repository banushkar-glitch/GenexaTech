# GenexaTech - Nginx site (template)
# setup-server.sh replaces __SERVER_NAMES__ and installs this as
# /etc/nginx/sites-available/genexatech. It sits next to the Firqui site on the
# same server; Nginx picks the site by the requested host name.
# Certbot later adds the HTTPS (443) settings to the installed copy.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    root /var/www/genexatech;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
